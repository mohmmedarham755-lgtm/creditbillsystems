name: creditbillsytems
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.5+1
  intl: ^0.20.2
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  sqflite: ^2.3.0
  path: ^1.9.0
