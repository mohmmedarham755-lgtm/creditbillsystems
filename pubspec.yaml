  # SQLite database support
  sqflite_common_ffi: ^2.3.0
  sqflite_common_ffi_web: ^1.2.0

  # Epic 6: Smart Calendar & Local Notifications
  table_calendar: ^3.1.3
  flutter_local_notifications: ^19.0.0
  timezone: ^0.10.0
  file_picker: ^12.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true